# Full stack: docker compose up --build  →  https://$DOMAIN (or http://localhost:4000 on the server itself)
x-service: &service
  build: .
  restart: unless-stopped
  environment: &env
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    INTERNAL_KEY: ${INTERNAL_KEY:?set INTERNAL_KEY in .env}
    SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
    AUTH_URL: http://auth:4001 # staff actions are written to its audit trail
    IDENTITY_URL: http://identity:4005 # Pirento One and Vault check for an issued Bharat ID
    REDIS_URL: redis://redis:6379 # shared cache and rate limits

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo-data:/data/db]

  # The wallet's money (on AWS: Aurora PostgreSQL, see deploy/aws).
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pirento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pirento_wallet
    volumes: [postgres-data:/var/lib/postgresql/data]

  # Shared cache and rate limits (on AWS: ElastiCache).
  redis:
    image: redis:7
    restart: unless-stopped

  auth:
    <<: *service
    environment:
      <<: *env
      SERVICE: auth
      MONGO_URI: mongodb://mongo:27017/pirento_auth
      SITE_URL: ${SITE_URL:?set SITE_URL in .env} # sign-in links in emails and texts
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env, sign-in codes are sent by email}
      EMAIL_FROM: ${EMAIL_FROM:-Pirento <no-reply@pirento.com>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
      SUPERADMIN_STAFF_ID: ${SUPERADMIN_STAFF_ID:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      TEST_USER_ID: ${TEST_USER_ID:-}
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:-}
      # Account deletion asks these services to forget the person, and checks the wallet first.
      WALLET_URL: http://wallet:4002
      IDENTITY_URL: http://identity:4005
      VAULT_URL: http://vault:4007
      AI_URL: http://ai:4009
      LEARNING_URL: http://learning:4006
      ORDERS_URL: http://orders:4004
      SUPPORT_URL: http://support:4008
    depends_on: [mongo]

  wallet:
    <<: *service
    environment:
      <<: *env
      SERVICE: wallet
      DATABASE_URL: postgres://pirento:${POSTGRES_PASSWORD}@postgres:5432/pirento_wallet
      RAZORPAYX_KEY_ID: ${RAZORPAYX_KEY_ID:-}
      RAZORPAYX_KEY_SECRET: ${RAZORPAYX_KEY_SECRET:-}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER:-}
      RAZORPAYX_WEBHOOK_SECRET: ${RAZORPAYX_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-} # card/UPI wallet top-ups
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on: [mongo]

  catalog:
    <<: *service
    environment: {<<: *env, SERVICE: catalog, MONGO_URI: mongodb://mongo:27017/pirento_catalog}
    depends_on: [mongo]

  orders:
    <<: *service
    environment:
      <<: *env
      SERVICE: orders
      MONGO_URI: mongodb://mongo:27017/pirento_orders
      WALLET_URL: http://wallet:4002
      CATALOG_URL: http://catalog:4003 # paused checkouts
      ORDERS_FILE_KEY: ${ORDERS_FILE_KEY:?set ORDERS_FILE_KEY in .env}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on: [mongo, wallet]

  identity:
    <<: *service
    environment:
      <<: *env
      SERVICE: identity
      MONGO_URI: mongodb://mongo:27017/pirento_identity
      KYC_ENCRYPTION_KEY: ${KYC_ENCRYPTION_KEY:?set KYC_ENCRYPTION_KEY in .env}
      SITE_URL: ${SITE_URL:?set SITE_URL in .env, e.g. https://pirento.com} # sign-in link in Bharat ID for Business emails
      DIGIO_ENV: ${DIGIO_ENV:-sandbox}
      DIGIO_CLIENT_ID: ${DIGIO_CLIENT_ID:-}
      DIGIO_CLIENT_SECRET: ${DIGIO_CLIENT_SECRET:-}
      DIGIO_WEBHOOK_SECRET: ${DIGIO_WEBHOOK_SECRET:-}
      DIGIO_KYC_TEMPLATE: ${DIGIO_KYC_TEMPLATE:-VIDEO_KYC}
      DIGIO_AADHAAR_TEMPLATE: ${DIGIO_AADHAAR_TEMPLATE:-}
      DIGIO_FACE_TEMPLATE: ${DIGIO_FACE_TEMPLATE:-}
      WALLET_URL: http://wallet:4002 # Bharat ID for Business calls are paid from the owner's wallet
      DIGIO_ESTAMP_TAG: ${DIGIO_ESTAMP_TAG:-}
    depends_on: [mongo]

  learning:
    <<: *service
    environment:
      <<: *env
      SERVICE: learning
      MONGO_URI: mongodb://mongo:27017/pirento_learning
      WALLET_URL: http://wallet:4002 # programme places are bought, and paid work is paid, through the wallet
      AI_URL: http://ai:4009 # tasks, reviews, intern matching and resume drafts
      OPENSEARCH_URL: ${OPENSEARCH_URL:-}
      LEARNING_FILE_KEY: ${LEARNING_FILE_KEY:?set LEARNING_FILE_KEY in .env}
      VIDEO_S3_BUCKET: ${VIDEO_S3_BUCKET:-}
      VIDEO_S3_ENDPOINT: ${VIDEO_S3_ENDPOINT:-}
      VIDEO_S3_REGION: ${VIDEO_S3_REGION:-auto}
      VIDEO_S3_KEY_ID: ${VIDEO_S3_KEY_ID:-}
      VIDEO_S3_SECRET: ${VIDEO_S3_SECRET:-}
    depends_on: [mongo]

  vault:
    <<: *service
    environment:
      <<: *env
      SERVICE: vault
      MONGO_URI: mongodb://mongo:27017/pirento_vault
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:?set VAULT_ENCRYPTION_KEY in .env}
    depends_on: [mongo]

  support:
    <<: *service
    environment:
      <<: *env
      SERVICE: support
      MONGO_URI: mongodb://mongo:27017/pirento_support
    depends_on: [mongo]

  ai:
    <<: *service
    environment:
      <<: *env
      SERVICE: ai
      MONGO_URI: mongodb://mongo:27017/pirento_ai
      # The assistant reads a person's own account in these (each one's /internal/assistant); plans use the wallet.
      WALLET_URL: http://wallet:4002
      ORDERS_URL: http://orders:4004
      LEARNING_URL: http://learning:4006
      SUPPORT_URL: http://support:4008
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: [mongo]

  gateway:
    <<: *service
    environment:
      <<: *env
      SERVICE: gateway
      WEB_DIST: /app/apps/web/dist
      AUTH_URL: http://auth:4001
      WALLET_URL: http://wallet:4002
      CATALOG_URL: http://catalog:4003
      ORDERS_URL: http://orders:4004
      IDENTITY_URL: http://identity:4005
      LEARNING_URL: http://learning:4006
      VAULT_URL: http://vault:4007
      SUPPORT_URL: http://support:4008
      AI_URL: http://ai:4009
    ports: ['127.0.0.1:4000:4000'] # public traffic comes through caddy
    depends_on: [auth, wallet, catalog, orders, identity, learning, vault, support, ai]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [gateway]

volumes:
  mongo-data:
  postgres-data:
  caddy-data:
