name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
      # The wallet keeps its money in PostgreSQL.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pirento
          POSTGRES_PASSWORD: pirento
          POSTGRES_DB: pirento_wallet
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
      # Shared cache and rate limits, as behind the load balancer.
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: End-to-end against the running stack
        env:
          SUPERADMIN_EMAILS: boss@example.com
          SUPERADMIN_STAFF_ID: root.admin
          SUPERADMIN_PASSWORD: change-me-now-123
          RATE_LIMIT_OTP: '500'
          RATE_LIMIT_PER_MIN: '5000'
          OTP_RESEND_SECONDS: '0'
          REDIS_URL: redis://127.0.0.1:6379
          # Bharat ID verification against the Digio stand-in
          DIGIO_URL: http://127.0.0.1:4090
          DIGIO_CLIENT_ID: test
          DIGIO_CLIENT_SECRET: test
          DIGIO_WEBHOOK_SECRET: test-digio-webhook
          DIGIO_ESTAMP_TAG: TEST_STAMP
          # Vault linked accounts, death certificates and Blue Dart parcels against the same stand-in
          DIGIO_AA_URL: http://127.0.0.1:4090/fiu_api
          DIGIO_AA_TEMPLATE: TEST_TEMPLATE
          APISETU_URL: http://127.0.0.1:4090/apisetu
          APISETU_CLIENT_ID: test
          APISETU_API_KEY: test
          BLUEDART_URL: http://127.0.0.1:4090/bluedart
          BLUEDART_CLIENT_ID: test
          BLUEDART_CLIENT_SECRET: test
          BLUEDART_LOGIN_ID: test
          BLUEDART_LICENCE_KEY: test
          # WhatsApp (Meta's Cloud API) against the same stand-in
          WHATSAPP_API_URL: http://127.0.0.1:4090/whatsapp
          WHATSAPP_TOKEN: test
          WHATSAPP_PHONE_ID: PHONE1
          WHATSAPP_APP_SECRET: test-wa-secret
          WHATSAPP_VERIFY_TOKEN: test-verify
        run: |
          node scripts/digio-standin.mjs > digio.log 2>&1 &
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4000/health && curl -sf http://127.0.0.1:4002/health && curl -sf http://127.0.0.1:4009/health && break
            sleep 2
          done
          npm run e2e
      - if: failure()
        run: cat dev.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t pirento .
